// JARVIS Companion — APK nativo que acompana a la PWA.
// Codigo original de este proyecto.
apply plugin: "com.android.application"

android {
    namespace "com.jarvsluna.companion"
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.jarvsluna.companion"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
